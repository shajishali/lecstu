    - "வைட்போர்டு உள்ள மண்டபம் தேடுங்கள்"
    - "இன்று மதியம் காலி கருத்தரங்க அறைகள் உள்ளதா?"
    - "எந்த கட்டிடத்தில் காலி மண்டபங்கள் உள்ளன?"
    - "மண்டபம் சி அடுத்து எப்போது கிடைக்கும்?"
  appointments:
    - "டாக்டர் குமாரிடம் சந்திப்பு பதிவு செய்ய விரும்புகிறேன்"
    - "நாளை டாக்டர் சில்வாவை பார்க்க முடியுமா?"
    - "பேராசிரியர் சென்னுடன் இடம் பதிவு செய்யுங்கள்"
    - "டாக்டர் பெர்னாண்டோவுடன் என் திட்டத்தை பற்றி பேச விரும்புகிறேன்"
    - "வியாழன் டாக்டர் பெரேரா கிடைக்கிறாரா?"
    - "என் ஆலோசகருடன் சந்திப்பு திட்டமிடுங்கள்"
