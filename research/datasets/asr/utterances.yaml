    - "டாக்டர் குமாருடனான சந்திப்பை ரத்து செய்ய விரும்புகிறேன்"
    - "என் சந்திப்பை வெள்ளிக்கு மாற்றுங்கள்"
    - "எனக்கு நிலுவையான சந்திப்புகள் உள்ளனவா?"
  directions:
    - "கணினி அறிவியல் கட்டிடம் எங்கே?"
    - "மண்டபம் பிக்கு எப்படி செல்வது?"
    - "டாக்டர் குமாரின் அலுவலகம் எங்கே?"
    - "பொறியியல் தொகுதியை காட்டுங்கள்"
    - "முதன்மை நூலகம் எங்கே?"
