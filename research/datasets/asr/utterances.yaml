  general:
    - "இன்று குழு பிக்கான வகுப்புகள் என்ன?"
    - "வளாக வரைபடத்தை காட்டுங்கள்"
    - "வானிலை எப்படி உள்ளது?"
    - "பல்கலைக்கழகம் எப்போது திறக்கும்?"
    - "தரவு கட்டமைப்பை யார் கற்றுத் தருகிறார்கள்?"
    - "கட்டிடம் சியில் எந்த துறை உள்ளது?"
    - "டாக்டர் சில்வா என்ன பாடங்களை கற்பிக்கிறார்?"
    - "அடுத்த தேர்வு எப்போது?"
    - "என் அறிவிப்புகளை காட்டுங்கள்"
    - "இந்த தளம் எந்த மொழிகளை ஆதரிக்கிறது?"

si:
  timetable:
    - "මගේ ඊළඟ දත්ත ව්යුහ පංතිය කවදාද?"
    - "සඳුදා මට ඇති පන්ති මොනවාද?"
    - "කණ්ඩායම බීට ඇල්ගොරිතම පන්තිය කවදාද?"
    - "හෙට උදේ දහයට පන්තියක් තිබේද?"
    - "අද කණ්ඩායම ඒ සඳහා පන්ති මොනවාද?"
    - "දත්ත සමුදාය පන්තිය කවදාද?"
    - "මගේ සතික වේලාසටි පෙන්වන්න"
    - "සිකුරාදා දහවල් පන්ති තිබේද?"
    - "ගණිත ඉගෙනීම් පන්තිය කොයි වේලාවටද?"
    - "බදාදා ගණිතය කණ්ඩායම් කිහිපයකටද?"
  halls:
    - "හෝල් බී පයින් දෙකට ලබා ගත හැකිද?"
    - "දැන් හිස් හෝල් මොනවාද?"
    - "පැයක් සඳහා හිස් හෝල් තිබේද?"
    - "ප්රොජෙක්ටර් ඇති හෝල් පෙන්වන්න"
    - "හෝල් ඒ පයින් තුනට පිරී තිබේද?"
    - "සිසුන් පනස් දෙනෙකුට ඉඩ ඇති හෝල් මොකක්ද?"
    - "සුදු පුවරුව ඇති හෝල් සොයන්න"
    - "අද දහවල් හිස් සාකච්ඡා කාමර තිබේද?"
    - "කුමන ගොඩනැගිල්ලට හිස් හෝල් තිබේද?"
    - "හෝල් සී ඊළඟට කවදා ලබා ගත හැකිද?"
  appointments:
    - "මට ඩොක්ටර් කුමාර් සමඟ හමුවීමක් කළ යුතුයි"
    - "හෙට ඩොක්ටර් සිල්වා හමුවීමට පුළුවන්ද?"
    - "ප්රොෆෙසර් චෙන් සමඟ ඉඩ පොයින්න"
    - "ඩොක්ටර් පර්නැන්ඩෝ සමඟ මගේ ව්යාපෘතිය සාකච්ඡා කරන්න ඕන"
    - "බ්රහස්පතින්දා ඩොක්ටර් පෙරේරා තිබේද?"
    - "මගේ උපදේශක සමඟ හමුවීම සැලසුම් කරන්න"
    - "ඩොක්ටර් ජයවර්ධන හමුවිය හැක්කේ කවදාද?"
    - "ඩොක්ටර් කුමාර් සමඟ හමුවීම අවලංගු කරන්න ඕන"
    - "මගේ හමුවීම සිකුරාදාට මාරු කරන්න"
    - "මට තැබුම් ඇති හමුවීම් තිබේද?"
  directions:
    - "පරිගණක විද්යා ගොඩනැගිල්ල කොහෙද?"
    - "හෝල් බී වෙත යන ආකාරය"
    - "ඩොක්ටර් කුමාර්ගේ කාර්යාලය කොහෙද?"
    - "ඉංජිනේරු බ්ලොක් පෙන්වන්න"
    - "ප්රධාන පුස්තකාලය කොහෙද?"
    - "විද්යා ගොඩනැගිල්ලට යන ආකාරය"
    - "දෙවන මහලේ කතාබහ කාමරය කොහෙද?"
    - "කැෆෙටීරියාවට යන මාර්ගය"
    - "ගණිත දෙපාර්තමේන්තුව කොහෙද?"
    - "කාමර තුන බිංදු එක සොයා ගන්නේ කෙසේද?"
  general:
    - "අද කණ්ඩායම බී සඳහා පන්ති මොනවාද?"
    - "කැම්පස් සිතියම පෙන්වන්න"
    - "කාලගුණය කෙබඳුද?"
