    - "ඩොක්ටර් සිල්වා ඉගැන්වෙන විෂය මොනවාද?"
    - "ඊළඟ විභාගය කවදාද?"
    - "මගේ දැනුම්දීම් පෙන්වන්න"
    - "මෙම වේදිකාව කුමන භාෂා සඳහා සහාය දක්වයිද?"
