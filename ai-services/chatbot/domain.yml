# LECSTU Chatbot Domain — Phase 8.1
# Intents, entities, slots, responses, and actions

version: "3.1"

intents:
  - ask_timetable
  - ask_hall_availability
  - ask_lecturer_availability
  - book_appointment
  - cancel_appointment
  - ask_directions
  - ask_todays_classes
  - guide_to_lecture_room
  - guide_to_next_class
  - ask_office_location
  - greeting
  - goodbye
  - affirm
  - deny
  - fallback
  - out_of_scope

entities:
  - course_name
  - lecturer_name
  - hall_name
  - day
  - time
  - building

slots:
  course_name:
    type: text
    mappings:
      - type: from_entity
        entity: course_name
  lecturer_name:
    type: text
    mappings:
      - type: from_entity
        entity: lecturer_name
  hall_name:
    type: text
    mappings:
      - type: from_entity
        entity: hall_name
  day:
    type: text
    mappings:
      - type: from_entity
        entity: day
  time:
    type: text
    mappings:
      - type: from_entity
        entity: time
  building:
    type: text
    mappings:
      - type: from_entity
        entity: building
  pending_timetable_day:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  awaiting_timetable_confirm:
    type: bool
    influence_conversation: true
    initial_value: false
    mappings:
      - type: custom

responses:
  utter_greeting:
    - text: "Hi. Ask me about timetables, halls, appointments, or campus directions."
  utter_goodbye:
    - text: "Bye."
  utter_fallback:
    - text: "Sorry, I didn't get that. Try asking about your timetable, a hall, an appointment, or directions."
  utter_out_of_scope:
    - text: "I only cover timetables, halls, appointments, and campus info. What do you need?"
  utter_ask_timetable:
    - text: "Checking your timetable."
  utter_ask_hall_availability:
    - text: "Checking hall availability."
  utter_ask_lecturer_availability:
    - text: "Checking lecturer availability."
  utter_book_appointment:
    - text: "Opening booking."
  utter_cancel_appointment:
    - text: "Looking up that appointment to cancel."
  utter_ask_directions:
    - text: "Finding directions."
  utter_ask_todays_classes:
    - text: "Checking today's classes."
  utter_guide_to_room:
    - text: "Finding the route to that room."
  utter_guide_to_next_class:
    - text: "Finding your next class and the route."
  utter_ask_office_location:
    - text: "Looking up the office."

actions:
  - action_recover_or_fallback
  - action_query_timetable
  - action_check_hall_availability
  - action_check_lecturer_availability
  - action_book_appointment
  - action_cancel_appointment
  - action_get_directions
  - action_today_on_campus
  - action_guide_to_room
  - action_guide_to_next_class
  - action_get_office_location

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
