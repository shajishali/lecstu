# LECSTU Rules — Phase 8.2
# Deterministic rules for greeting, goodbye, fallback, out_of_scope

version: "3.1"

rules:
  - rule: Affirm (e.g. yes after timetable confirm)
    steps:
      - intent: affirm
      - action: action_recover_or_fallback

  - rule: Deny (e.g. no after timetable confirm)
    steps:
      - intent: deny
      - action: action_recover_or_fallback

  - rule: Ask timetable
    steps:
      - intent: ask_timetable
      - action: action_query_timetable

  - rule: Say greeting
    steps:
      - intent: greeting
      - action: utter_greeting

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Fallback
    steps:
      - intent: fallback
      - action: action_recover_or_fallback

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: action_recover_or_fallback
