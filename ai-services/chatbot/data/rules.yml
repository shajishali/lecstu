# LECSTU Rules — Phase 8.2
# Deterministic rules for greeting, goodbye, fallback, out_of_scope

version: "3.1"

rules:
  - rule: Say greeting
    steps:
      - intent: greeting
      - action: utter_greeting

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Fallback
    steps:
      - intent: fallback
      - action: utter_fallback

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope
